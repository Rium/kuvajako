<!DOCTYPE html>
<html>

<head>
  <title>{{ pic.title }}</title>
</head>

<body>
  <h1>{{ pic.title }}</h1>
  <hr />
  Added by <a href="/user/{{ pic.user_id }}">{{ pic.username }}</a> at {{ pic.sent_at }}
  <hr />
  {% if session.user_id == pic.user_id %}
  <p>
    <a href="/edit/{{ pic.id }}">Edit the title</a> | 
    <a href="/delete/{{ pic.id }}">Delete</a>
  </p>
  {% endif %}
  <p>
    <a href="/gallery">Back to the gallery</a>
  </p>
</body>

</html>
