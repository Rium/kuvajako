<!DOCTYPE html>
<html>

<head>
  <title>Add a picture</title>
</head>

<body>
  {% if session.username %}
  <h1>Add a picture</h1>
  {% for message in get_flashed_messages() %}
    <p><strong>{{ message }}</strong></p>
  {% endfor %}
  <form action="/new_pic" method="post">
    <p>
      Title: <br />
      <input type="text" name="title" />
    </p>
    <p>
      <input type="submit" value="Send" />
    </p>
  </form>
  {% else %}
  How did you get here?
  {% endif %}
</body>

</html>
