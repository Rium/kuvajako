<!DOCTYPE html>
<html>

<head>
  <title>Add a picture</title>
</head>

<body>
  {% if session.username %}
  <h1>Add a picture</h1>
  {% for message in get_flashed_messages() %}
    <p><strong>{{ message }}</strong></p>
  {% endfor %}
  <form action="/new_pic" method="post">
    <p>
      Title: <br />
      <input type="text" name="title" maxlength="50" required/>
    </p>
  <p>
  {% for category in all_tags %}
  <p>
    {{ category }}: <br />
    <select name="tags">
      <option value="">(Choose {{ category }})</option>
    {% for option in all_tags[category] %}
      <option value="{{ category }}:{{ option }}">{{ option }}</option>
    {% endfor %}
    </select>
  </p>
  {% endfor %}
    </select>
  </p>
    <p>
      <input type="submit" value="Send" />
    </p>
  </form>
  {% else %}
  How did you get here?
  {% endif %}
</body>

</html>
